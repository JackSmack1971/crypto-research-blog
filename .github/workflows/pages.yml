name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Each pull request is refs/pull/<number>/merge, so checks do not cancel each other.
# Pushes to main share pages-deploy, and a deploy that has started is left to finish.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages-deploy' || format('pages-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        run: python3 build.py

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  styling-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Content and structure checks
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install test runner
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Match the fonts used to capture the baselines
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-croscore
          sudo cp tests/ci-fonts.conf /etc/fonts/conf.d/99-crypto-research-baselines.conf
          fc-cache -f
          fc-match serif
          fc-match sans
          fc-match Tinos

      - name: Browser regression checks
        run: npx playwright test

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, styling-check]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
