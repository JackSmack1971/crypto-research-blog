<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Baselines were captured in Chromium with fonts-croscore and
       fonts-noto-core installed. The editorial serif stack resolves to
       Tinos. Interface text resolves to Noto Sans. Do not alias the serif
       families to Noto Serif: that face is wider and changes text wrapping. -->
  <alias><family>sans-serif</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias><family>Segoe UI</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias><family>Arial</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias><family>Helvetica</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias><family>Helvetica Neue</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias><family>Inter</family><prefer><family>Noto Sans</family></prefer></alias>
</fontconfig>
