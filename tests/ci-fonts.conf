<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- The screenshot baselines were captured where Georgia, Palatino, and
       the generic serif all resolve to Noto Serif, and sans and system-ui
       resolve to Noto Sans. GitHub-hosted runners prefer different faces,
       which changes text-wrap and page height. Prefer the same faces there. -->
  <alias><family>serif</family><prefer><family>Noto Serif</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias><family>Georgia</family><prefer><family>Noto Serif</family></prefer></alias>
  <alias><family>Times New Roman</family><prefer><family>Noto Serif</family></prefer></alias>
  <alias><family>Palatino</family><prefer><family>Noto Serif</family></prefer></alias>
  <alias><family>Palatino Linotype</family><prefer><family>Noto Serif</family></prefer></alias>
  <alias><family>Iowan Old Style</family><prefer><family>Noto Serif</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias><family>Segoe UI</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias><family>Arial</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias><family>Helvetica</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias><family>Helvetica Neue</family><prefer><family>Noto Sans</family></prefer></alias>
  <alias><family>Inter</family><prefer><family>Noto Sans</family></prefer></alias>
</fontconfig>
